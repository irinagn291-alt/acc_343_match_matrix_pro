name: MatchMatrix
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CLANG_ENABLE_MODULES: true
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
targets:
  MatchMatrix:
    type: application
    platform: iOS
    sources:
    - Black
    - Sources
    - Assets.xcassets
    - WidgetShared
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.matchmatrix.analytics
        MARKETING_VERSION: '1.0'
        INFOPLIST_FILE: Support/AppInfo.plist
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: 1,2
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_CFBundleDisplayName: Match Matrix
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: Support/App.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: '1'
        SWIFT_VERSION: '6.0'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
          ENABLE_TESTABILITY: 'YES'
    dependencies:
    - target: MatchMatrixWidget
      embed: true
  MatchMatrixWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - WidgetTests/WidgetTests.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.matchmatrix.analytics.widgettests
        SWIFT_VERSION: '6.0'
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1,2
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: -Onone
    dependencies:
    - target: MatchMatrix
  MatchMatrixUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - Tests/UITests.swift
    - WidgetTests/WidgetIntegrationTests.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.matchmatrix.analytics.uitests
        SWIFT_VERSION: '6.0'
        TARGETED_DEVICE_FAMILY: 1,2
      configs:
        Debug: {}
    dependencies:
    - target: MatchMatrix
  MatchMatrixWidget:
    type: app-extension
    platform: iOS
    sources:
    - WidgetShared
    - WidgetExtension
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS:
        - $(inherited)
        - '@executable_path/Frameworks'
        - '@executable_path/../../Frameworks'
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: '1.0'
        INFOPLIST_FILE: WidgetExtension/Info.plist
        SKIP_INSTALL: 'YES'
        TARGETED_DEVICE_FAMILY: 1,2
        GENERATE_INFOPLIST_FILE: 'NO'
        CODE_SIGN_ENTITLEMENTS: Support/Widget.entitlements
        SWIFT_VERSION: '6.0'
        CURRENT_PROJECT_VERSION: '1'
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.matchmatrix.analytics.widget
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
          SWIFT_OPTIMIZATION_LEVEL: -Onone
schemes:
  MatchMatrix:
    build:
      targets:
        MatchMatrix: all
    test:
      targets:
      - MatchMatrixUITests
      - MatchMatrixWidgetTests
